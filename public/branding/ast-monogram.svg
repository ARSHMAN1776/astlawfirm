<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" fill="none">
  <!-- Minimalist Architectural Geometric Monogram for AST -->
  <!-- Outer subtle boundary frame -->
  <rect x="8" y="8" width="144" height="144" stroke="currentColor" stroke-width="1.2" stroke-opacity="0.25"/>
  
  <!-- Central AST Monogram Construction -->
  <g stroke="currentColor" stroke-linecap="square" stroke-linejoin="miter">
    <!-- Top Horizontal Bar of 'T' / Architecture beam -->
    <line x1="32" y1="36" x2="128" y2="36" stroke-width="3.5" />
    
    <!-- Central Pillar ('T' stem and 'A' apex axis) -->
    <line x1="80" y1="36" x2="80" y2="124" stroke-width="2.5" />
    
    <!-- 'A' Structure: Slanted rafters converging towards upper central apex -->
    <path d="M42 124 L80 40 L118 124" stroke-width="3" fill="none" />
    
    <!-- 'A' Crossbar -->
    <line x1="56" y1="94" x2="104" y2="94" stroke-width="2.2" />
    
    <!-- 'S' Fluid Balance Curves woven through the pillar -->
    <path d="M102 54 C94 46, 68 46, 64 62 C60 76, 100 78, 96 98 C92 112, 66 114, 58 106" stroke-width="2.8" fill="none" stroke-opacity="0.9" />
  </g>
  
  <!-- Subtle inner cornerstone accents -->
  <line x1="8" y1="20" x2="20" y2="8" stroke="currentColor" stroke-width="1" stroke-opacity="0.3" />
  <line x1="152" y1="20" x2="140" y2="8" stroke="currentColor" stroke-width="1" stroke-opacity="0.3" />
  <line x1="8" y1="140" x2="20" y2="152" stroke-width="1" stroke-opacity="0.3" />
  <line x1="152" y1="140" x2="140" y2="152" stroke="currentColor" stroke-width="1" stroke-opacity="0.3" />
</svg>
