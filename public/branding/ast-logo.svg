<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 100" width="100%" height="100%" fill="none">
  <!-- Monogram Mark on the Left -->
  <g transform="translate(10, 10) scale(0.5)">
    <rect x="8" y="8" width="144" height="144" stroke="currentColor" stroke-width="1.5" stroke-opacity="0.35"/>
    <line x1="32" y1="36" x2="128" y2="36" stroke="currentColor" stroke-width="4" stroke-linecap="square"/>
    <line x1="80" y1="36" x2="80" y2="124" stroke="currentColor" stroke-width="3"/>
    <path d="M42 124 L80 40 L118 124" stroke="currentColor" stroke-width="3.5" fill="none"/>
    <line x1="56" y1="94" x2="104" y2="94" stroke="currentColor" stroke-width="2.5"/>
    <path d="M102 54 C94 46, 68 46, 64 62 C60 76, 100 78, 96 98 C92 112, 66 114, 58 106" stroke="currentColor" stroke-width="3" fill="none"/>
  </g>
  
  <!-- Subtle Vertical Divider -->
