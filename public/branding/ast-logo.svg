  <text x="130" y="38" fill="currentColor" font-family="'Cinzel', 'Playfair Display', serif" font-size="20" font-weight="600" letter-spacing="0.14em">AST LAW FIRM</text>
  
  <!-- Line 2: Principal Name -->
  <text x="130" y="58" fill="currentColor" font-family="'Cinzel', 'Playfair Display', serif" font-size="13" font-weight="500" letter-spacing="0.22em" fill-opacity="0.85">AHMAD SABIR TANOLI</text>
  
  <!-- Line 3: Professional Descriptor -->
  <text x="130" y="76" fill="currentColor" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="500" letter-spacing="0.28em" fill-opacity="0.65">ADVOCATES · SOLICITORS · CORPORATE COUNSELLORS</text>
</svg>
